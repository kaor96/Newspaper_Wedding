<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Periódico de Boda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Libre+Baskerville:ital@0;1&family=UnifrakturMaguntia&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="screen.css" />
  <link rel="stylesheet" href="templates.css" />
  <link rel="stylesheet" href="print.css" media="print" />
</head>
<body>
  <main id="app">

    <!-- STEP 1: pick template -->
    <section class="step" id="stepTemplate" data-active="true">
      <header class="stepHeader">
        <h1>Elegir periódico</h1>
      </header>
      <div class="templateGrid" id="templateGrid"></div>
    </section>

    <!-- STEP 2: full-screen editor -->
    <section class="step" id="stepEditor">
      <div class="editorTopbar">
        <button class="editorBack" id="editorBack">&#8249; Volver</button>
        <span class="editorTitle" id="editorTitle"></span>
        <div class="editorTopActions">
          <button class="editorTemplatePrint" id="editorTemplatePrint">Sin foto</button>
          <button class="editorPrint" id="editorPrint">Imprimir</button>
        </div>
      </div>
      <div class="editorArticleBar" id="editorArticleBar" hidden>
        <button class="eabBtn" id="eabFutbol" data-toggle="futbol">&#9917; F&uacute;tbol</button>
        <button class="eabBtn eabActive" id="eabVip" data-toggle="vip">&#11088; VIP</button>
        <button class="eabBtn" id="eabFashion" data-toggle="fashion">&#128084; Fashion</button>
        <button class="eabBtn" id="eabGalapagos" data-toggle="galapagos">&#128034; Gal&aacute;pagos</button>
        <button class="eabBtn" id="eabSobriety" data-toggle="sobriety">&#127864; Sobriety</button>
      </div>
<div class="editorCanvas" id="editorCanvas">
        <div id="editorNewspaper"></div>
      </div>
      <input type="file" id="editorPhotoInput" accept="image/*" hidden />
      <div class="editorBottomBar" id="photoControls" hidden>
        <button class="bbBtn" id="photoChangeBtn">&#128247; Cambiar foto</button>
        <div class="bbDivider"></div>
        <div class="bbZoom">
          <button class="bbBtn bbZoomBtn" id="scaleDown">&#8722;</button>
          <span class="bbZoomLabel" id="scaleLabel">100%</span>
          <button class="bbBtn bbZoomBtn" id="scaleUp">&#43;</button>
        </div>
      </div>
    </section>

  </main>

  <div id="printSheet" aria-hidden="true"></div>

  <script src="templates.js"></script>
  <script src="app.js"></script>
</body>
</html>
